name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: 1.0.0)"
        required: false
        type: string

      prerelease:
        description: "Mark as prerelease"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    env:
      VERSION: ${{ github.event.inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm archlinux-keyring
          source packaging/PKGBUILD-git
          pacman -Syu --noconfirm --needed base-devel wget patchelf qt6ct kvantum lxqt-qtplugin \
            "${depends[@]}" "${makedepends[@]}"

      - name: Build
        env:
          CXXFLAGS: -Wno-sfinae-incomplete
        run: cargo build --release --locked

      - name: Install
        run: |
          install -Dm755 target/release/omikuji /usr/bin/omikuji
          install -Dm644 crates/omikuji/qml/icons/app.png \
            /usr/share/icons/hicolor/512x512/apps/io.github.reakjra.omikuji.png
          sed "s|@EXEC_PATH@|/usr/bin/omikuji|" packaging/io.github.reakjra.omikuji.desktop.in \
            | install -Dm644 /dev/stdin /usr/share/applications/io.github.reakjra.omikuji.desktop

      - name: Make AppImage
        working-directory: packaging
        run: ./make-appimage.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AppImage
          path: "packaging/dist/*.AppImage"
          archive: false

      - name: Build changelog link
        id: notes
        run: |
          anchor=$(printf '%s' "${VERSION#v}" | tr -d .)
          echo "body=**Full Changelog**: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md#${anchor})" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.notes.outputs.body }}
          files: "packaging/dist/*.AppImage"
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
